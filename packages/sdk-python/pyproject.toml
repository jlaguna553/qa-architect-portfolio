[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "qa-architect-sdk"
version = "1.0.0"
description = "SDK de telemetría para FastAPI/Starlette - QA Arquitecto"
requires-python = ">=3.10"
dependencies = [
    "starlette>=0.27.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0"]
django = ["django>=4.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qa_architect_sdk*"]
